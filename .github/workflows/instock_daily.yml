name: Sync Instock Daily Surabaya (Realtime Daemon)

on:
  schedule:
    # Trigger setiap 30 menit untuk menjaga runner selalu hidup bergantian
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Instock Realtime Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
          # Menjalankan worker selama 28 menit (1680 detik) sebelum auto-restart
          WORKER_DURATION_SECONDS: 1680
          POLL_INTERVAL_SECONDS: 15
        run: |
          python instock_daily.py
