name: Sync Instock Daily Surabaya

on:
  schedule:
    # Berjalan tiap 5 menit sekali dari jam 10:00 WIB s/d 22:00 WIB (03:00 - 15:00 UTC)
    - cron: '*/5 3-15 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Instock Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python instock_daily.py
