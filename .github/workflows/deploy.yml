name: Deploy Reflex App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: erp-reflex-sby
        run: |
          python -m pip install --upgrade pip
          pip install reflex reflex-hosting-cli
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Deploy to Reflex Cloud
        working-directory: erp-reflex-sby
        env:
          REFLEX_AUTH_TOKEN: ${{ secrets.REFLEX_AUTH_TOKEN }}
          REFLEX_TOKEN: ${{ secrets.REFLEX_AUTH_TOKEN }}
        run: |
          reflex deploy --token "${{ secrets.REFLEX_AUTH_TOKEN }}" --project 0caca57c-de13-42cf-a528-063339c49cbd --app-name erp-logistik-sby --region sin --no-interactive
