name: Deploy Reflex App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Reflex Cloud
        uses: reflex-dev/reflex-deploy-action@v1
        with:
          auth_token: ${{ secrets.REFLEX_AUTH_TOKEN }}
          project_id: "0caca57c-de13-42cf-a528-063339c49cbd"
          directory: erp-reflex-sby
          extra_args: "--app-name erp-reflex-sby-v2"
          python_version: "3.12"