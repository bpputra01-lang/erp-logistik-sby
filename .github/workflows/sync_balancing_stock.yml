name: Sync Balancing Stock Surabaya (Stock & Sales 90D)

on:
  schedule:
    # Berjalan otomatis setiap 60 menit sekali (pada menit ke-0 tiap jam)
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub Actions

jobs:
  sync-balancing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas openpyxl beautifulsoup4

      - name: Run Balancing Stock Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python sync_balancing_stock.py
