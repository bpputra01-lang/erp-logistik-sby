name: Jezpro Stock Sync Worker

on:
  schedule:
    # Berjalan tiap 1 jam sekali dari jam 10:00 WIB s/d 21:00 WIB (03:00 - 14:00 UTC)
    - cron: '0 3-14 * * *'
  workflow_dispatch: # Tombol manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas openpyxl beautifulsoup4

      - name: Jalankan Sync Jezpro ke Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python worker_sync_jezpro.py
