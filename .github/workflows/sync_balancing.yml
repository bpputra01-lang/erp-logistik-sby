name: Sync Balancing Stock Surabaya

on:
  schedule:
    # Tiap 2 jam sekali (10:00, 12:00, 14:00, 16:00, 18:00, 20:00 WIB)
    - cron: '0 3,5,7,9,11,13 * * *'
    
    # Jadwal tambahan pukul 21:30 WIB (14:30 UTC)
    - cron: '30 14 * * *'
    
  workflow_dispatch:

jobs:
  sync-balancing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas openpyxl beautifulsoup4

      - name: Run Balancing Stock Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python .github/scripts/sync_balancing_stock.py
