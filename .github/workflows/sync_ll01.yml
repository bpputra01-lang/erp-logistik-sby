name: Sync LL01 Waiting Jezpro to Supabase

on:
  schedule:
    # 1. Berjalan reguler tiap 15 menit (:00, :15, :30, :45) dari jam 06:00 - 22:00 WIB
    - cron: '*/15 23,0-15 * * *'

    # 2. Tambahan spesifik jam 15:25 WIB (08:25 UTC) dan 21:25 WIB (14:25 UTC)
    - cron: '25 8,14 * * *'

    # 3. Tambahan spesifik jam 21:55 WIB (14:55 UTC)
    - cron: '55 14 * * *'

  # Memungkinkan tombol "Run workflow" manual kapan saja
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python sync_ll01.py
