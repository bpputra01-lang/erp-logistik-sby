name: Sync LL01 Waiting Jezpro to Supabase

on:
  schedule:
    # 1. Jam 10:00 WIB (03:00 UTC)
    - cron: '0 3 * * *'

    # 2. Jam 15:35 WIB (08:35 UTC)
    - cron: '35 8 * * *'

    # 3. Jam 21:20 WIB dan 21:50 WIB (14:20 & 14:50 UTC)
    - cron: '20,50 14 * * *'

  # Memungkinkan tombol "Run workflow" manual kapan saja
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JEZPRO_EMAIL: ${{ secrets.JEZPRO_EMAIL }}
          JEZPRO_PASSWORD: ${{ secrets.JEZPRO_PASSWORD }}
        run: |
          python sync_ll01.py
