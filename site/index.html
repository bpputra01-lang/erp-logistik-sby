<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZKN WAREHOUSE ERP</title>
    
    <!-- FAVICON DARI FILE GAMBAR ASLI: image_981625.png -->
    <link rel="icon" type="image/png" href="./image_981625.png" />
    
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "python",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />

    <!-- =====================================================================
         CSS CUSTOM PREMIUM SPLASH SCREEN (MENGGUNAKAN LOGO image_981625.png)
    ====================================================================== -->
    <style>
      /* 1. Sembunyikan default loader & SVG bawaan Shinylive */
      .shinylive-loading, 
      .pyodide-loading, 
      .loading-spinner, 
      .loading-container,
      #root > div[class*="loading"],
      #root svg {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }

      /* 2. Fullscreen Splash Screen Container */
      #zkn-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1A1D24 0%, #0D0F12 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #FFFFFF;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      /* 3. Logo Box & Gambar Asli (image_981625.png) */
      .zkn-splash-logo-box {
        width: 90px;
        height: 90px;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(229, 9, 20, 0.4);
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(229, 9, 20, 0.5);
        margin-bottom: 22px;
        animation: zknPulse 2s infinite ease-in-out;
        padding: 12px;
        backdrop-filter: blur(5px);
      }

      .zkn-splash-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      }

      @keyframes zknPulse {
        0% { transform: scale(1); box-shadow: 0 0 25px rgba(229, 9, 20, 0.4); border-color: rgba(229, 9, 20, 0.4); }
        50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(229, 9, 20, 0.75); border-color: rgba(229, 9, 20, 0.8); }
        100% { transform: scale(1); box-shadow: 0 0 25px rgba(229, 9, 20, 0.4); border-color: rgba(229, 9, 20, 0.4); }
      }

      .zkn-splash-title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        margin: 0 0 4px 0;
        color: #FFFFFF;
        text-transform: uppercase;
      }

      .zkn-splash-title span {
        color: #E50914;
      }

      .zkn-splash-subtitle {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #C5A059;
        text-transform: uppercase;
        margin: 0 0 30px 0;
      }

      /* 4. Animated Glowing Progress Bar (Gradasi Emas - Merah) */
      .zkn-progress-track {
        width: 290px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        margin-bottom: 15px;
      }

      .zkn-progress-fill {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #C5A059, #E50914, #C5A059);
        background-size: 200% 100%;
        border-radius: 10px;
        position: absolute;
        animation: zknBarMove 1.6s infinite linear;
      }

      @keyframes zknBarMove {
        0% { left: -45%; background-position: 0% 50%; }
        100% { left: 100%; background-position: 100% 50%; }
      }

      .zkn-splash-status {
        font-size: 12px;
        color: #A0AEC0;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: opacity 0.3s ease;
      }

      .zkn-version-badge {
        position: absolute;
        bottom: 25px;
        font-size: 11px;
        color: #4A5568;
        font-weight: 700;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    
    <!-- TEMPAT SHINY BERJALAN -->
    <div style="height: 100vh; width: 100vw" id="root"></div>

    <!-- STRUKTUR SPLASH SCREEN DENGAN GAMBAR image_981625.png -->
    <div id="zkn-splash-screen">
      <div class="zkn-splash-logo-box">
        <img src="./image_981625.png" alt="ZKN Logo" class="zkn-splash-logo-img" />
      </div>
      <div class="zkn-splash-title">ZKN <span>LOGISTIC</span></div>
      <div class="zkn-splash-subtitle">CENTER WAREHOUSE SYSTEM • SURABAYA</div>
      
      <div class="zkn-progress-track">
        <div class="zkn-progress-fill"></div>
      </div>
      
      <div id="zkn-status-text" class="zkn-splash-status">Menginisialisasi Engine WebAssembly Python...</div>
      <div class="zkn-version-badge">ERP WAREHOUSE SUPPORTING TOOLS v2.0</div>
    </div>

    <!-- SCRIPT DETEKTOR OTOMATIS: FADE OUT BEGITU SHINY READY -->
    <script>
      (function() {
        const statusMessages = [
          "Menginisialisasi Engine WebAssembly Python...",
          "Memuat Library Pandas, NumPy & Engine Data...",
          "Menghubungkan Database & Modul Warehouse...",
          "Menyiapkan Antarmuka Sistem ERP...",
          "Selesai! Membuka Sistem..."
        ];
        
        let msgIdx = 0;
        const statusEl = document.getElementById("zkn-status-text");
        
        const msgInterval = setInterval(function() {
          msgIdx = (msgIdx + 1) % statusMessages.length;
          if (statusEl) {
            statusEl.style.opacity = "0";
            setTimeout(function() {
              statusEl.innerText = statusMessages[msgIdx];
              statusEl.style.opacity = "1";
            }, 300);
          }
        }, 1800);

        // Kunci Favicon & Judul Tab
        document.title = "ZKN WAREHOUSE ERP";

        // Deteksi secara real-time kapan Shiny selesai merender UI ke #root
        const checkReady = setInterval(function() {
          const root = document.getElementById("root");
          const hasContent = root && (
            root.querySelector("#login_username_field") ||
            root.querySelector("#main-scroll-container") ||
            root.querySelector(".container-fluid, .page-fluid, form, button, table") ||
            (root.children.length > 0 && !root.querySelector(".shinylive-loading"))
          );

          if (hasContent) {
            clearInterval(checkReady);
            clearInterval(msgInterval);

            const splash = document.getElementById("zkn-splash-screen");
            if (splash) {
              splash.style.opacity = "0";
              setTimeout(function() {
                splash.style.display = "none";
                splash.remove();
              }, 600);
            }
          }
        }, 100);
      })();
    </script>
    
  </body>
</html>
